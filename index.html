<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>多語言翻譯助手 · 三語下拉+語音</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', 'Noto Sans CJK TC', 'Noto Sans Japanese', 'Noto Sans Korean', 'Helvetica Neue', sans-serif;
            font-weight: 500;  /* 粗黑體清楚 */
            background: #eef2f7;
            margin: 0;
            min-height: 100vh;
            padding: 12px;
        }
        .app-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 16px;
        }
        .header {
            background: #1e3a5f;
            padding: 16px 20px;
            color: white;
        }
        .header h1 {
            margin: 0 0 4px 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header p {
            margin: 0;
            opacity: 0.85;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .content {
            padding: 16px 18px;
        }
        /* 三語下拉專區 - 手機縮小版 */
        .triple-dropdown-area {
            background: #f8fafc;
            border-radius: 24px;
            padding: 12px 14px;
            margin-bottom: 20px;
            border: 1px solid #e2edf2;
        }
        .triple-title {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 10px;
            color: #0f2b3f;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dropdown-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .dropdown-item {
            flex: 1;
            min-width: 140px;
        }
        .dropdown-item label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1e3a5f;
        }
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.8rem;
            background: white;
            font-weight: 500;
            font-family: inherit;
        }
        .search-input:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 0 2px rgba(30,58,95,0.2);
        }
        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 48px;
            justify-content: center;
        }
        .mode-btn {
            background: transparent;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            color: #334155;
        }
        .mode-btn.active {
            background: #1e3a5f;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            color: #1e293b;
            font-size: 0.85rem;
        }
        textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.9rem;
            border: 2px solid #cbd5e1;
            border-radius: 20px;
            font-family: inherit;
            font-weight: 500;
            resize: vertical;
            background: #fefefe;
        }
        textarea:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 0 2px rgba(30,58,95,0.2);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .result-wrapper {
            background: #f1f5f9;
            border-radius: 18px;
            padding: 12px 14px;
            border-left: 4px solid #1e3a5f;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .result-box {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
        }
        .speak-btn, .voice-btn, .stop-btn, .translate-btn, button {
            background: #1e3a5f;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }
        .speak-btn {
            background: #475569;
        }
        .voice-btn {
            background: #2c6e2f;
        }
        .stop-btn {
            background: #9a3412;
        }
        .translate-btn {
            background: #1e3a5f;
        }
        button.small {
            background: #475569;
            padding: 5px 12px;
            font-size: 0.7rem;
        }
        button:active {
            transform: scale(0.96);
        }
        .custom-section {
            background: #f8fafc;
            border-radius: 20px;
            padding: 14px;
            margin-top: 18px;
            border: 1px solid #e2e8f0;
        }
        .custom-section h4 {
            font-size: 0.85rem;
            font-weight: 700;
            margin: 0 0 10px 0;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .flex-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: inherit;
        }
        .note {
            font-size: 0.65rem;
            color: #475569;
            text-align: center;
            margin-top: 18px;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
            font-weight: 500;
        }
        .badge {
            background: #e6f0ff;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #1e3a5f;
        }
        .voice-status {
            margin-left: 8px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #2c6e2f;
        }
        /* 手機專屬調整 */
        @media (max-width: 560px) {
            body {
                padding: 8px;
            }
            .content {
                padding: 12px 14px;
            }
            .dropdown-row {
                flex-direction: column;
                gap: 10px;
            }
            .dropdown-item {
                width: 100%;
            }
            .mode-selector {
                padding: 6px 10px;
            }
            .mode-btn {
                padding: 5px 12px;
                font-size: 0.75rem;
            }
            .button-group {
                gap: 8px;
            }
            .speak-btn, .voice-btn, .stop-btn, .translate-btn {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
            .result-wrapper {
                padding: 10px 12px;
            }
            .header h1 {
                font-size: 1.2rem;
            }
        }
        /* 粗體強化 */
        strong, b, .mode-btn, .triple-title, label, .badge, .custom-section h4 {
            font-weight: 700;
        }
        input, textarea, .search-input {
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <div class="header">
            <h1>🌏 三語翻譯助手</h1>
            <p>中英｜中日｜中韓獨立下拉 · 語音輸入 · 手打翻譯</p>
        </div>
        <div class="content">
            <!-- 三個獨立下拉選單 (手機縮小版) -->
            <div class="triple-dropdown-area">
                <div class="triple-title">
                    📋 各語言常用句下拉 <span style="font-size:0.65rem;">(打字即篩選)</span>
                </div>
                <div class="dropdown-row">
                    <div class="dropdown-item">
                        <label>🇬🇧 中英詞庫 (EN)</label>
                        <input type="text" id="enDropdownInput" class="search-input" placeholder="點選或輸入中文..." list="enDatalist" autocomplete="off">
                        <datalist id="enDatalist"></datalist>
                    </div>
                    <div class="dropdown-item">
                        <label>🇯🇵 中日詞庫 (日本語)</label>
                        <input type="text" id="jaDropdownInput" class="search-input" placeholder="點選或輸入中文..." list="jaDatalist" autocomplete="off">
                        <datalist id="jaDatalist"></datalist>
                    </div>
                    <div class="dropdown-item">
                        <label>🇰🇷 中韓詞庫 (한국어)</label>
                        <input type="text" id="koDropdownInput" class="search-input" placeholder="點選或輸入中文..." list="koDatalist" autocomplete="off">
                        <datalist id="koDatalist"></datalist>
                    </div>
                </div>
                <div style="font-size:0.65rem; margin-top: 8px; color:#4a627a;">✨ 點選後自動填入中文並切換模式，同步翻譯</div>
            </div>

            <!-- 模式切換按鈕 -->
            <div class="mode-selector" id="modeSelector">
                <button data-mode="general" class="mode-btn active">📖 中英模式</button>
                <button data-mode="japanese" class="mode-btn">🗾 日語模式</button>
                <button data-mode="korean" class="mode-btn">🇰🇷 韓語模式</button>
            </div>

            <!-- 輸入區域 -->
            <div class="input-group">
                <label>✏️ 手打 / 語音輸入區</label>
                <textarea id="inputText" rows="2" placeholder="例如： 謝謝 / 你好 / 多少錢 / 我想去車站 / こんにちは"></textarea>
                <div class="button-group">
                    <button id="clearBtn">清空</button>
                    <button id="voiceInputBtn" class="voice-btn">🎤 語音輸入</button>
                    <button id="voiceStopBtn" class="stop-btn">⏹️ 停止</button>
                    <button id="translateBtn" class="translate-btn">🔍 翻譯</button>
                    <span id="voiceStatus" class="voice-status"></span>
                </div>
            </div>

            <!-- 翻譯結果 -->
            <div class="input-group">
                <label>🔊 翻譯結果 <span class="badge" id="langHint">模式: 中英雙向</span></label>
                <div class="result-wrapper">
                    <div class="result-box" id="outputText">✨ 輸入內容後自動翻譯...</div>
                    <button id="speakResultBtn" class="speak-btn">🔊 朗讀</button>
                </div>
            </div>

            <!-- 自訂詞彙 -->
            <div class="custom-section">
                <h4>📝 自訂詞彙 (目前語言模式專用)</h4>
                <div class="flex-row">
                    <input type="text" id="newWord" placeholder="原文 (單字/短語)">
                    <input type="text" id="newTrans" placeholder="翻譯">
                    <button id="addWordBtn">➕ 新增</button>
                </div>
                <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button id="resetCustomBtn" class="small">🗑️ 清除當前自訂詞</button>
                    <span class="badge">各模式獨立儲存</span>
                </div>
            </div>
            <div class="note">
                💡 支援中/英/日/韓句子匹配 | 下拉內容自動排序 | 手機可用<br>
                🎤 語音輸入中文 (允許麥克風) | 🔽 下拉選單輸入一個字即可過濾
            </div>
        </div>
    </div>
</div>

<script>
    // ----------------------------- 全域變數 -----------------------------
    let currentMode = 'general';       // 'general', 'japanese', 'korean'
    let dictGeneral = { dual: {} };
    let dictJapanese = { dual: {} };
    let dictKorean = { dual: {} };
    
    // 自訂詞彙 (每個模式獨立)
    let customDict = {
        general: { forward: {}, backward: {} },
        japanese: { forward: {}, backward: {} },
        korean: { forward: {}, backward: {} }
    };
    
    let activeForwardMap = {};
    let activeBackwardMap = {};
    let recognition = null;
    let isRecognizing = false;
    let isLoading = true;
    
    // DOM 元素
    const inputTextarea = document.getElementById('inputText');
    const outputDiv = document.getElementById('outputText');
    const clearBtn = document.getElementById('clearBtn');
    const addWordBtn = document.getElementById('addWordBtn');
    const resetCustomBtn = document.getElementById('resetCustomBtn');
    const speakResultBtn = document.getElementById('speakResultBtn');
    const voiceInputBtn = document.getElementById('voiceInputBtn');
    const voiceStopBtn = document.getElementById('voiceStopBtn');
    const translateBtn = document.getElementById('translateBtn');
    const voiceStatusSpan = document.getElementById('voiceStatus');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const langHintSpan = document.getElementById('langHint');
    
    const enDropdownInput = document.getElementById('enDropdownInput');
    const jaDropdownInput = document.getElementById('jaDropdownInput');
    const koDropdownInput = document.getElementById('koDropdownInput');
    const enDatalist = document.getElementById('enDatalist');
    const jaDatalist = document.getElementById('jaDatalist');
    const koDatalist = document.getElementById('koDatalist');
    
    // ----------------------------- 輔助函數 -----------------------------
    function cleanText(text) {
        let cleaned = text.trim();
        cleaned = cleaned.replace(/[。，！？；：""''（）【】《》…—・、,\.!\?;:\(\)\[\]\{\}<>]/g, '');
        cleaned = cleaned.replace(/\s+/g, ' ').trim();
        return cleaned;
    }
    
    // 內建備用詞庫 (確保離線也有內容)
    function getFallbackDict(langType) {
        if (langType === 'en') {
            return {
                "你好": "Hello", "謝謝": "Thank you", "對不起": "Sorry", "多少錢": "How much",
                "廁所在哪裡": "Where is the restroom", "我來自台灣": "I'm from Taiwan",
                "很好吃": "Delicious", "再見": "Goodbye", "飯店": "Hotel", "車站": "Station"
            };
        } else if (langType === 'ja') {
            return {
                "你好": "こんにちは", "謝謝": "ありがとう", "對不起": "すみません", "多少錢": "いくらですか",
                "廁所在哪裡": "トイレはどこですか", "我來自台灣": "台湾から来ました",
                "很好吃": "美味しいです", "再見": "さようなら", "飯店": "ホテル", "車站": "駅"
            };
        } else if (langType === 'ko') {
            return {
                "你好": "안녕하세요", "謝謝": "감사합니다", "對不起": "죄송합니다", "多少錢": "얼마예요",
                "廁所在哪裡": "화장실이 어디에요", "我來自台灣": "저는 대만에서 왔어요",
                "很好吃": "맛있어요", "再見": "안녕히 가세요", "飯店": "호텔", "車站": "역"
            };
        }
        return {};
    }
    
    async function loadJSON(url, fallbackObj) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch (err) {
            console.warn(`載入 ${url} 失敗，使用內建詞庫`, err);
            return fallbackObj;
        }
    }
    
    function buildDropdownOptions() {
        const enKeys = Object.keys(dictGeneral.dual).sort((a,b) => a.localeCompare(b, 'zh'));
        enDatalist.innerHTML = '';
        enKeys.forEach(key => { const opt = document.createElement('option'); opt.value = key; enDatalist.appendChild(opt); });
        
        const jaKeys = Object.keys(dictJapanese.dual).sort((a,b) => a.localeCompare(b, 'zh'));
        jaDatalist.innerHTML = '';
        jaKeys.forEach(key => { const opt = document.createElement('option'); opt.value = key; jaDatalist.appendChild(opt); });
        
        const koKeys = Object.keys(dictKorean.dual).sort((a,b) => a.localeCompare(b, 'zh'));
        koDatalist.innerHTML = '';
        koKeys.forEach(key => { const opt = document.createElement('option'); opt.value = key; koDatalist.appendChild(opt); });
    }
    
    async function loadAllDictionaries() {
        const generalData = await loadJSON('data/zh_en_dual.json', getFallbackDict('en'));
        dictGeneral.dual = generalData;
        const japaneseData = await loadJSON('data/zh_ja_dual.json', getFallbackDict('ja'));
        dictJapanese.dual = japaneseData;
        const koreanData = await loadJSON('data/zh_ko_dual.json', getFallbackDict('ko'));
        dictKorean.dual = koreanData;
        
        loadCustomFromStorage();
        rebuildActiveMaps();
        buildDropdownOptions();
        isLoading = false;
        if (inputTextarea.value.trim() !== "") performTranslation();
        else outputDiv.innerHTML = "✨ 離線詞庫就緒，可點選下拉選單或手打翻譯";
    }
    
    function loadCustomFromStorage() {
        const modes = ['general', 'japanese', 'korean'];
        for (let mode of modes) {
            const stored = localStorage.getItem(`customDict_${mode}`);
            if (stored) {
                try { customDict[mode] = JSON.parse(stored); } catch(e) {}
            } else {
                customDict[mode] = { forward: {}, backward: {} };
            }
        }
    }
    
    function saveCurrentCustom() {
        localStorage.setItem(`customDict_${currentMode}`, JSON.stringify(customDict[currentMode]));
    }
    
    function rebuildActiveMaps() {
        let baseForward = {};
        let baseBackward = {};
        if (currentMode === 'general') {
            baseForward = { ...dictGeneral.dual };
            for (const [k, v] of Object.entries(baseForward)) baseBackward[v] = k;
        } else if (currentMode === 'japanese') {
            baseForward = { ...dictJapanese.dual };
            for (const [k, v] of Object.entries(baseForward)) baseBackward[v] = k;
        } else {
            baseForward = { ...dictKorean.dual };
            for (const [k, v] of Object.entries(baseForward)) baseBackward[v] = k;
        }
        const customF = customDict[currentMode].forward || {};
        const customB = customDict[currentMode].backward || {};
        activeForwardMap = { ...baseForward, ...customF };
        activeBackwardMap = { ...baseBackward, ...customB };
        for (const [src, tgt] of Object.entries(customF)) if (!activeBackwardMap[tgt]) activeBackwardMap[tgt] = src;
        for (const [tgt, src] of Object.entries(customB)) if (!activeForwardMap[src]) activeForwardMap[src] = tgt;
        
        let modeText = currentMode === 'general' ? '中英雙向' : (currentMode === 'japanese' ? '中日雙向 (旅日)' : '中韓雙向 (旅韓)');
        langHintSpan.innerText = `模式: ${modeText}`;
    }
    
    function translateWithLongestMatch(rawText, forwardMap, backwardMap) {
        let cleaned = cleanText(rawText);
        if (cleaned === "") return "";
        let lowerInput = cleaned.toLowerCase();
        if (forwardMap[lowerInput]) return forwardMap[lowerInput];
        if (backwardMap[lowerInput]) return backwardMap[lowerInput];
        const words = cleaned.split(/\s+/);
        if (words.length === 1) {
            const single = words[0].toLowerCase();
            if (forwardMap[single]) return forwardMap[single];
            if (backwardMap[single]) return backwardMap[single];
            return "⚠️ 未收錄此詞彙，可點擊「新增自訂詞」";
        } else {
            let translatedParts = [];
            let unknown = 0;
            for (let w of words) {
                const lw = w.toLowerCase();
                if (forwardMap[lw]) translatedParts.push(forwardMap[lw]);
                else if (backwardMap[lw]) translatedParts.push(backwardMap[lw]);
                else { translatedParts.push(w); unknown++; }
            }
            if (unknown === words.length) return "⚠️ 無匹配詞彙，建議使用下拉選單或新增自訂詞";
            return translatedParts.join(" ");
        }
    }
    
    function performTranslation() {
        if (isLoading) { outputDiv.innerHTML = "⏳ 詞庫載入中..."; return; }
        const rawText = inputTextarea.value;
        if (!rawText.trim()) { outputDiv.innerHTML = "⚡ 輸入內容後自動翻譯..."; return; }
        const result = translateWithLongestMatch(rawText, activeForwardMap, activeBackwardMap);
        outputDiv.innerHTML = result;
    }
    
    function setMode(mode) {
        if (currentMode === mode) return;
        currentMode = mode;
        modeBtns.forEach(btn => {
            if (btn.getAttribute('data-mode') === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        rebuildActiveMaps();
        performTranslation();
    }
    
    function speakText(text) {
        if (!text || text.startsWith("⚠️") || text.startsWith("⚡")) return;
        const utterance = new SpeechSynthesisUtterance(text);
        const jaRegex = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/;
        const koRegex = /[\uAC00-\uD7AF\u1100-\u11FF]/;
        const engRegex = /[a-zA-Z]/;
        if (koRegex.test(text)) utterance.lang = 'ko-KR';
        else if (jaRegex.test(text)) utterance.lang = 'ja-JP';
        else if (engRegex.test(text) && !/[\u4e00-\u9fff]/.test(text)) utterance.lang = 'en-US';
        else utterance.lang = 'zh-TW';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }
    
    function addCustomWord() {
        const source = document.getElementById('newWord').value.trim();
        const target = document.getElementById('newTrans').value.trim();
        if (!source || !target) { alert("請填寫原文和翻譯"); return; }
        const modeCust = customDict[currentMode];
        modeCust.forward[source] = target;
        modeCust.backward[target] = source;
        saveCurrentCustom();
        rebuildActiveMaps();
        document.getElementById('newWord').value = '';
        document.getElementById('newTrans').value = '';
        alert(`✅ 已新增：${source} → ${target}`);
        performTranslation();
    }
    
    function resetCurrentCustom() {
        if (confirm(`確定清除「${currentMode}」模式的所有自訂詞彙嗎？`)) {
            customDict[currentMode] = { forward: {}, backward: {} };
            saveCurrentCustom();
            rebuildActiveMaps();
            performTranslation();
            alert("自訂詞彙已清除");
        }
    }
    
    // 語音輸入初始化
    function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            voiceStatusSpan.innerText = '⚠️ 不支援語音';
            if (voiceInputBtn) voiceInputBtn.disabled = true;
            if (voiceStopBtn) voiceStopBtn.disabled = true;
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'zh-TW';
        recognition.onstart = () => {
            isRecognizing = true;
            voiceStatusSpan.innerText = '🎙️ 聆聽中...';
            if (voiceInputBtn) voiceInputBtn.style.opacity = '0.6';
            if (voiceStopBtn) voiceStopBtn.disabled = false;
        };
        recognition.onend = () => {
            isRecognizing = false;
            voiceStatusSpan.innerText = '';
            if (voiceInputBtn) voiceInputBtn.style.opacity = '1';
            if (voiceStopBtn) voiceStopBtn.disabled = true;
        };
        recognition.onerror = (event) => {
            let errMsg = event.error === 'not-allowed' ? '❌ 麥克風未允許' : (event.error === 'no-speech' ? '⏳ 沒聽到聲音' : `錯誤: ${event.error}`);
            voiceStatusSpan.innerText = errMsg;
            setTimeout(() => { if (voiceStatusSpan.innerText === errMsg) voiceStatusSpan.innerText = ''; }, 2000);
            isRecognizing = false;
            if (voiceInputBtn) voiceInputBtn.style.opacity = '1';
            if (voiceStopBtn) voiceStopBtn.disabled = true;
        };
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (transcript) {
                const cleaned = cleanText(transcript);
                inputTextarea.value = cleaned;
                performTranslation();
                voiceStatusSpan.innerText = '✅ 完成';
                setTimeout(() => { if (voiceStatusSpan.innerText === '✅ 完成') voiceStatusSpan.innerText = ''; }, 1500);
            }
            recognition.stop();
        };
    }
    
    function startVoiceInput() {
        if (!recognition) { alert("語音不支援"); return; }
        if (isRecognizing) { recognition.stop(); setTimeout(() => { try { recognition.start(); } catch(e) {} }, 150); }
        else { try { recognition.start(); } catch(e) { voiceStatusSpan.innerText = '請稍後重試'; } }
    }
    function stopVoiceInput() {
        if (recognition && isRecognizing) { recognition.stop(); voiceStatusSpan.innerText = '⏹️ 已停止'; setTimeout(() => { if (voiceStatusSpan.innerText === '⏹️ 已停止') voiceStatusSpan.innerText = ''; }, 1200); }
    }
    
    // 下拉事件 (選取後填寫中文並切換模式)
    function setupDropdowns() {
        enDropdownInput.addEventListener('change', function() {
            const selected = this.value.trim();
            if (selected && dictGeneral.dual[selected]) {
                if (currentMode !== 'general') setMode('general');
                inputTextarea.value = selected;
                performTranslation();
            }
        });
        jaDropdownInput.addEventListener('change', function() {
            const selected = this.value.trim();
            if (selected && dictJapanese.dual[selected]) {
                if (currentMode !== 'japanese') setMode('japanese');
                inputTextarea.value = selected;
                performTranslation();
            }
        });
        koDropdownInput.addEventListener('change', function() {
            const selected = this.value.trim();
            if (selected && dictKorean.dual[selected]) {
                if (currentMode !== 'korean') setMode('korean');
                inputTextarea.value = selected;
                performTranslation();
            }
        });
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
        await loadAllDictionaries();
        setupDropdowns();
        inputTextarea.addEventListener('input', performTranslation);
        clearBtn.addEventListener('click', () => { inputTextarea.value = ''; outputDiv.innerHTML = "⚡ 輸入內容後自動翻譯..."; });
        addWordBtn.addEventListener('click', addCustomWord);
        resetCustomBtn.addEventListener('click', resetCurrentCustom);
        speakResultBtn.addEventListener('click', () => {
            const rt = outputDiv.innerText;
            if (rt && !rt.includes("⚠️") && !rt.includes("⚡")) speakText(rt);
            else alert("沒有可朗讀的翻譯結果");
        });
        translateBtn.addEventListener('click', performTranslation);
        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => { const mode = btn.getAttribute('data-mode'); if (mode) setMode(mode); });
        });
        initSpeechRecognition();
        if (voiceInputBtn) voiceInputBtn.addEventListener('click', startVoiceInput);
        if (voiceStopBtn) voiceStopBtn.addEventListener('click', stopVoiceInput);
        performTranslation();
    });
</script>
</body>
</html>
