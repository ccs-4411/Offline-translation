<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>多語言離線翻譯器 · 旅遊常用句 + 語音</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Noto Sans CJK TC', 'Microsoft YaHei', 'Noto Sans Japanese', 'Noto Sans Korean', sans-serif;
            background: #eef2f7;
            margin: 0;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 950px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .header {
            background: #1e3a5f;
            padding: 20px 28px;
            color: white;
        }
        .header h1 {
            margin: 0 0 6px 0;
            font-size: 1.7rem;
            font-weight: 600;
        }
        .header p {
            margin: 0;
            opacity: 0.8;
            font-size: 0.85rem;
        }
        .content {
            padding: 24px 28px;
        }
        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 48px;
            justify-content: center;
        }
        .mode-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #334155;
            font-size: 0.9rem;
        }
        .mode-btn.active {
            background: #1e3a5f;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 24px;
        }
        label {
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #1e293b;
        }
        textarea {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 20px;
            font-family: inherit;
            resize: vertical;
            background: #fefefe;
        }
        textarea:focus {
            outline: none;
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30,58,95,0.2);
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .result-wrapper {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 14px 18px;
            border-left: 5px solid #1e3a5f;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .result-box {
            font-size: 1rem;
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
        }
        .speak-btn {
            background: #475569;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.1s;
        }
        .speak-btn:active {
            transform: scale(0.96);
        }
        .voice-btn {
            background: #2c6e2f;
        }
        .stop-btn {
            background: #9a3412;
        }
        .translate-btn {
            background: #1e3a5f;
        }
        .travel-section {
            background: #fefce8;
            border-radius: 24px;
            padding: 18px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }
        .travel-title {
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        .travel-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px 2px;
        }
        .travel-chip {
            background: white;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            transition: all 0.1s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .travel-chip:hover {
            background: #e6f0ff;
            border-color: #1e3a5f;
        }
        .custom-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }
        .flex-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .flex-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.85rem;
        }
        button {
            background: #1e3a5f;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
        }
        button.small {
            background: #475569;
            padding: 6px 14px;
            font-size: 0.75rem;
        }
        button:active {
            transform: scale(0.96);
        }
        .note {
            font-size: 0.7rem;
            color: #475569;
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .badge {
            background: #e6f0ff;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #1e3a5f;
        }
        .voice-status {
            margin-left: 12px;
            font-size: 0.75rem;
            color: #2c6e2f;
        }
        @media (max-width: 550px) {
            .content { padding: 18px; }
            .header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <div class="header">
            <h1>🌏 多語言翻譯器 · 旅遊達人</h1>
            <p>中英｜中日｜中韓 + 旅遊常用句 + 語音輸入/朗讀 (離線詞庫)</p>
        </div>
        <div class="content">
            <!-- 模式切換 -->
            <div class="mode-selector" id="modeSelector">
                <button data-mode="general" class="mode-btn active">📖 一般翻譯 (中↔英)</button>
                <button data-mode="japanese" class="mode-btn">🗾 旅遊日語 (中⇄日)</button>
                <button data-mode="korean" class="mode-btn">🇰🇷 旅遊韓語 (中⇄韓)</button>
            </div>

            <div class="input-group">
                <label>✏️ 輸入詞彙 / 句子</label>
                <textarea id="inputText" rows="2" placeholder="例如： 謝謝 / 你好 / 多少錢 / 我想去車站 / こんにちは"></textarea>
                <div class="button-group">
                    <button id="clearBtn">清空</button>
                    <button id="voiceInputBtn" class="voice-btn">🎤 語音輸入</button>
                    <button id="voiceStopBtn" class="stop-btn">⏹️ 停止</button>
                    <button id="translateBtn" class="translate-btn">🔍 翻譯</button>
                    <span id="voiceStatus" class="voice-status"></span>
                </div>
            </div>

            <div class="input-group">
                <label>🔊 翻譯結果 <span class="badge" id="langHint">目前模式: 中英雙向</span></label>
                <div class="result-wrapper">
                    <div class="result-box" id="outputText">✨ 輸入內容後自動翻譯...</div>
                    <button id="speakResultBtn" class="speak-btn">🔊 朗讀</button>
                </div>
            </div>

            <!-- 旅遊常用句區域 (動態更新) -->
            <div class="travel-section" id="travelSection">
                <div class="travel-title">✈️ 旅遊常用句 · 點擊即填</div>
                <div class="travel-grid" id="travelPhrasesList">📖 載入中...</div>
            </div>

            <!-- 自訂詞彙 (依當前模式獨立儲存) -->
            <div class="custom-section">
                <h4>📝 自訂詞彙 (針對目前語言模式，永久保存)</h4>
                <div class="flex-row">
                    <input type="text" id="newWord" placeholder="原文 (單字/短語)">
                    <input type="text" id="newTrans" placeholder="翻譯">
                    <button id="addWordBtn">➕ 新增</button>
                </div>
                <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="resetCustomBtn" class="small">🗑️ 清除當前模式自訂詞</button>
                    <span class="badge">自訂詞庫會依模式分開儲存</span>
                </div>
            </div>
            <div class="note">
                💡 支援中/英/日/韓句子自動匹配 (最長匹配)。<br>
                🗂️ 詞庫從外部 JSON 載入 (data/ 目錄)，旅遊句子獨立顯示。<br>
                🔊 點擊「朗讀」即可聽取翻譯結果 (支援日語/韓語/中文/英語發音)。<br>
                🎤 語音輸入支援中文 (國語)，按停止可中斷辨識。<br>
                🔍 若自動翻譯未觸發，請點「翻譯」按鈕手動執行。
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
