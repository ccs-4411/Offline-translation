<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
   <link rel="icon" href="icon-192.png">
   <link rel="apple-touch-icon" href="icon-192.png">
   <link rel="manifest" href="manifest.json">

    <title>雙向對話翻譯助手 · 語音不對調版</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', 'Noto Sans CJK TC', 'Noto Sans Japanese', 'Noto Sans Korean', 'Helvetica Neue', sans-serif;
            font-weight: 500;
            background: #eef2f7;
            margin: 0;
            min-height: 100vh;
            padding: 6px;
        }
        .app-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            overflow: hidden;
            margin-bottom: 12px;
        }
        .header {
            background: #1e3a5f;
            padding: 10px 14px;
            color: white;
        }
        .header h1 { margin: 0 0 2px 0; font-size: 1.2rem; font-weight: 700; }
        .header p { margin: 0; font-size: 0.6rem; opacity: 0.85; }
        .content { padding: 10px 12px; }
        
        /* 模式切換 */
        .mode-selector {
            display: flex; gap: 5px; margin-bottom: 12px;
            background: #f8fafc; padding: 5px 8px; border-radius: 40px; justify-content: center;
        }
        .mode-btn {
            background: transparent; border: none; padding: 4px 10px;
            border-radius: 40px; font-weight: 600; font-size: 0.7rem; cursor: pointer; color: #334155;
        }
        .mode-btn.active { background: #1e3a5f; color: white; }
        
        .input-group { margin-bottom: 12px; }
        label { font-weight: 700; font-size: 0.7rem; margin-bottom: 3px; display: flex; justify-content: space-between; }
        
        /* 下拉選單 */
        select.phrase-select {
            width: 100%; padding: 8px 12px; font-size: 0.8rem; border: 2px solid #cbd5e1;
            border-radius: 16px; font-family: inherit; font-weight: 500; background: #fefefe; color: #1e293b; outline: none; cursor: pointer;
        }
        select.phrase-select:focus { border-color: #1e3a5f; box-shadow: 0 0 0 2px rgba(30,58,95,0.15); }
        
        .button-group { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
        
        /* 翻譯對話框 */
        .result-wrapper {
            background: #f1f5f9; border-radius: 14px; padding: 10px 12px;
            border-left: 4px solid #1e3a5f; margin-top: 5px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .result-box { font-size: 0.85rem; font-weight: 500; word-break: break-word; }
        
        /* 按鈕定義 */
        button { border: none; padding: 5px 12px; border-radius: 30px; color: white; font-weight: 600; font-size: 0.65rem; cursor: pointer; }
        .voice-zh-btn { background: #0284c7; } /* 中文藍 */
        .voice-foreign-btn { background: #ea580c; } /* 外文橘 */
        .stop-btn { background: #9a3412; }
        .reset-btn { background: #64748b; }
        button.small { padding: 4px 10px; font-size: 0.6rem; }
        
        .custom-section { background: #f8fafc; border-radius: 16px; padding: 8px 10px; margin-top: 12px; border: 1px solid #e2e8f0; }
        .custom-section h4 { font-size: 0.7rem; margin: 0 0 6px 0; font-weight: 700; }
        .flex-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .flex-row input { flex: 1; padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 30px; font-size: 0.7rem; }
        .note { font-size: 0.55rem; color: #475569; text-align: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid #e2e8f0; }
        .badge { background: #e6f0ff; padding: 2px 6px; border-radius: 20px; font-size: 0.6rem; font-weight: 600; color: #1e3a5f; }
        .voice-status { font-size: 0.6rem; color: #2c6e2f; margin-left: 4px; font-weight: bold; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <div class="header">
            <h1>💬 雙向對話式隨身翻譯</h1>
            <p>獨立語音按鈕 · 解決語系對調與發音錯誤問題</p>
        </div>
        <div class="content">

            <!-- 模式切換 -->
            <div class="mode-selector" id="modeSelector">
                <button data-mode="general" class="mode-btn active">🇺🇸 中英對話模式</button>
                <button data-mode="japanese" class="mode-btn">🗾 中日對話模式</button>
                <button data-mode="korean" class="mode-btn">🇰🇷 中韓對話模式</button>
            </div>

            <!-- 免打字快速選單 -->
            <div class="input-group">
                <label>🔽 常用對話雙向對照庫 <span class="badge" id="langHint">模式: 中英對話</span></label>
                <select id="inputText" class="phrase-select">
                    <option value="">⏳ 正在載入對話字典...</option>
                </select>
                <div class="button-group">
                    <button id="clearBtn" class="reset-btn">清除選擇</button>
                    <!-- 核心改良：拆分兩個獨立語音鈕，誰說話就按誰 -->
                    <button id="voiceZhBtn" class="voice-zh-btn">🎤 說中文</button>
                    <button id="voiceForeignBtn" class="voice-foreign-btn">🎤 說外文</button>
                    <button id="voiceStopBtn" class="stop-btn">⏹️ 停止</button>
                    <span id="voiceStatus" class="voice-status"></span>
                </div>
            </div>

            <!-- 翻譯結果與獨立重播 -->
            <div class="input-group">
                <label>🔊 對話翻譯結果</label>
                <div class="result-wrapper">
                    <div class="result-box" id="outputText">✨ 請選擇上方對話，或點擊語音按鈕開始對話...</div>
                    <div style="display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px;">
                        <button id="speakZhBtn" class="small" style="background:#0284c7;">🔊 播中文</button>
                        <button id="speakForeignBtn" class="small" style="background:#ea580c;">🔊 播外文</button>
                    </div>
                </div>
            </div>

            <!-- 自訂詞彙 -->
            <div class="custom-section">
                <h4>📝 新增日常對話句</h4>
                <div class="flex-row">
                    <input type="text" id="newWord" placeholder="中文內容">
                    <input type="text" id="newTrans" placeholder="外文內容">
                    <button id="addWordBtn" style="background:#1e3a5f;">➕ 新增</button>
                </div>
                <div style="margin-top: 6px; display: flex; gap: 6px;">
                    <button id="resetCustomBtn" class="small" style="background:#64748b;">🗑️ 清除當前自訂對話</button>
                </div>
            </div>
            
            <div class="note">
                💡 <b>對話指南</b>：你說話請按【🎤 說中文】（會自動放外文語音）；外國人說話請按【🎤 說外文】（辨識後會精準播放中文翻譯）。
            </div>
        </div>
    </div>
</div>

<script>
    // ----------------------------- 字典與全域變數 -----------------------------
    let currentMode = 'general';
    let dictGeneral = { dual: {} };
    let dictJapanese = { dual: {} };
    let dictKorean = { dual: {} };
    
    let customDict = {
        general: { forward: {}, backward: {} },
        japanese: { forward: {}, backward: {} },
        korean: { forward: {}, backward: {} }
    };
    
    let activeForwardMap = {}; // 中 -> 外
    let activeBackwardMap = {}; // 外 -> 中
    let recognition = null;
    let isRecognizing = false;
    let isLoading = true;
    let recognitionTarget = 'zh'; // 'zh' 或 'foreign'
    
    // 當前暫存的雙語文字，供重播鈕隨時調用
    let currentZhText = "";
    let currentForeignText = "";
    
    const inputTextSelect = document.getElementById('inputText');
    const outputDiv = document.getElementById('outputText');
    const clearBtn = document.getElementById('clearBtn');
    const addWordBtn = document.getElementById('addWordBtn');
    const resetCustomBtn = document.getElementById('resetCustomBtn');
    
    const voiceZhBtn = document.getElementById('voiceZhBtn');
    const voiceForeignBtn = document.getElementById('voiceForeignBtn');
    const voiceStopBtn = document.getElementById('voiceStopBtn');
    const voiceStatusSpan = document.getElementById('voiceStatus');
    
    const speakZhBtn = document.getElementById('speakZhBtn');
    const speakForeignBtn = document.getElementById('speakForeignBtn');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const langHintSpan = document.getElementById('langHint');
    
    function cleanText(text) {
        return text.trim().replace(/[。，！？；：""''（）【】《》…—・、,\.!\?;:\(\)\[\]\{\}<>]/g, '').replace(/\s+/g, ' ').trim();
    }
    
    function getFallbackDict(langType) {
        if (langType === 'en') return { "你好":"Hello","謝謝":"Thank you","多少錢":"How much","對不起":"Sorry","沒問題":"No problem" };
        if (langType === 'ja') return { "你好":"こんにちは","謝謝":"ありがとう","多少錢":"いくらですか","對不起":"すみません","沒問題":"問題ないです" };
        return { "你好":"안녕하세요","謝謝":"감사합니다","多少錢":"얼마예요","對不起":"죄송합니다","沒問題":"문제 없어요" };
    }
    
    async function loadJSON(url, fallbackObj) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            return await res.json();
        } catch { return fallbackObj; }
    }
    
    // 改良：下拉選單不再鎖定單向，直接呈現完整雙向對照「中文 ⇄ 外文」
    function updateSelectOptions() {
        inputTextSelect.innerHTML = '';
        let defaultOpt = document.createElement('option');
        defaultOpt.value = '';
        defaultOpt.textContent = '--- 💡 點選對話免打字 (雙向通用) ---';
        inputTextSelect.appendChild(defaultOpt);
        
        // 依中文排序並塞入選單
        Object.keys(activeForwardMap).sort((a,b)=>a.localeCompare(b,'zh')).forEach(zh => {
            let foreign = activeForwardMap[zh];
            let opt = document.createElement('option');
            opt.value = `${zh}|${foreign}`; // 用分隔符號儲存雙向資料
            opt.textContent = `${zh} ⇄ ${foreign}`;
            inputTextSelect.appendChild(opt);
        });
    }
    
    async function loadAllDictionaries() {
        dictGeneral.dual = await loadJSON('data/zh_en_dual.json', getFallbackDict('en'));
        dictJapanese.dual = await loadJSON('data/zh_ja_dual.json', getFallbackDict('ja'));
        dictKorean.dual = await loadJSON('data/zh_ko_dual.json', getFallbackDict('ko'));
        
        loadCustomFromStorage();
        rebuildActiveMaps();
        isLoading = false;
        renderTranslationView("✨ 請選擇對話或開始語音錄音...", "", null);
    }
    
    function loadCustomFromStorage() {
        ['general','japanese','korean'].forEach(mode=>{
            const stored = localStorage.getItem(`customDict_${mode}`);
            if(stored) try{ customDict[mode]=JSON.parse(stored); }catch(e){}
            else customDict[mode]={ forward:{}, backward:{} };
        });
    }
    
    function saveCurrentCustom() { localStorage.setItem(`customDict_${currentMode}`, JSON.stringify(customDict[currentMode])); }
    
    function rebuildActiveMaps() {
        let baseForward={}, baseBackward={};
        if(currentMode==='general') { baseForward={...dictGeneral.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        else if(currentMode==='japanese') { baseForward={...dictJapanese.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        else { baseForward={...dictKorean.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        
        const cf = customDict[currentMode].forward || {};
        const cb = customDict[currentMode].backward || {};
        activeForwardMap = { ...baseForward, ...cf };
        activeBackwardMap = { ...baseBackward, ...cb };
        
        for(let [src,tgt] of Object.entries(cf)) if(!activeBackwardMap[tgt]) activeBackwardMap[tgt]=src;
        for(let [tgt,src] of Object.entries(cb)) if(!activeForwardMap[src]) activeForwardMap[src]=tgt;
        
        let langLabel = currentMode === 'general' ? '英文' : (currentMode === 'japanese' ? '日文' : '韓文');
        voiceForeignBtn.textContent = `🎤 說${langLabel}`;
        langHintSpan.innerText = `模式: 中${langLabel}雙向對話`;
        
        updateSelectOptions();
    }
    
    // 統一渲染介面與發音的函數 (完美拆分語系)
    function renderTranslationView(bigText, smallText, speakLang) {
        outputDiv.innerHTML = `
            <div style="font-size: 1.15rem; font-weight: 700; color: #1e3a5f; margin-bottom: 4px;">${bigText}</div>
            <div style="font-size: 0.85rem; color: #64748b; font-weight: 600;">${smallText}</div>
        `;
        
        if (speakLang && !bigText.includes('未收錄')) {
            let utterance = new SpeechSynthesisUtterance(bigText);
            utterance.lang = speakLang;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }
    
    function getForeignLangCode() {
        if (currentMode === 'japanese') return 'ja-JP';
        if (currentMode === 'korean') return 'ko-KR';
        return 'en-US';
    }
    
    function setMode(mode) {
        if(currentMode===mode) return;
        currentMode=mode;
        modeBtns.forEach(btn=>{
            if(btn.getAttribute('data-mode')===mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        rebuildActiveMaps();
        renderTranslationView("✨ 模式已切換，請選擇對話或使用語音...", "", null);
    }
    
    // ----------------------------- 雙向語音辨識核心 -----------------------------
    function initSpeechRecognition() {
        if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
            voiceStatusSpan.innerText='⚠️ 瀏覽器不支援語音功能';
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        
        recognition.onstart = () => {
            isRecognizing = true;
            voiceStatusSpan.innerText = recognitionTarget === 'zh' ? '🎙️ 正在聆聽中文...' : '🎙️ 正在聆聽外文...';
        };
        
        recognition.onend = () => {
            isRecognizing = false;
            voiceStatusSpan.innerText = '';
        };
        
        recognition.onerror = () => {
            voiceStatusSpan.innerText = '❌ 沒聽清楚，請再試一次';
            isRecognizing = false;
        };
        
        recognition.onresult = (event) => {
            let transcript = event.results[0][0].transcript;
            if(!transcript) return;
            let cleaned = cleanText(transcript);
            
            if (recognitionTarget === 'zh') {
                // 【情境 1】你說中文 -> 畫面大字秀外文（給對方看），語音直接自動播放外文
                currentZhText = cleaned;
                let foreignText = activeForwardMap[cleaned];
                let foreignCode = getForeignLangCode();
                
                if (foreignText) {
                    currentForeignText = foreignText;
                    inputTextSelect.value = `${cleaned}|${foreignText}`; // 同步下拉選單亮燈
                    renderTranslationView(foreignText, `原始中文: ${cleaned}`, foreignCode);
                } else {
                    currentForeignText = "[未收錄此對話翻譯]";
                    renderTranslationView(`[未收錄詞庫] ${cleaned}`, "可於下方新增此句對話", null);
                }
            } else {
                // 【情境 2】外國人說外文 -> 畫面大字秀中文（給你看），語音精準自動播放中文！
                currentForeignText = cleaned;
                let lowCleaned = cleaned.toLowerCase();
                // 支援不分大小寫的模糊反查
                let foundForeignIdx = Object.keys(activeBackwardMap).find(k => k.toLowerCase() === lowCleaned || k.toLowerCase().includes(lowCleaned));
                let zhText = foundForeignIdx ? activeBackwardMap[foundForeignIdx] : null;
                
                if (zhText) {
                    currentZhText = zhText;
                    inputTextSelect.value = `${zhText}|${foundForeignIdx}`; // 同步下拉選單亮燈
                    renderTranslationView(zhText, `Original: ${cleaned}`, 'zh-TW'); // 精準播放中文聲音！
                } else {
                    currentZhText = "[未收錄此句中文翻譯]";
                    renderTranslationView(`[外文辨識成功]: ${cleaned}`, "字典無對應中文，請手動自訂擴充", null);
                }
            }
        };
    }
    
    function startVoiceInput(target) {
        if (!recognition) return;
        if (isRecognizing) recognition.stop();
        
        recognitionTarget = target;
        if (target === 'zh') {
            recognition.lang = 'zh-TW';
        } else {
            recognition.lang = getForeignLangCode();
        }
        
        try { recognition.start(); } catch(e){}
    }
    
    function stopVoiceInput() {
        if (recognition && isRecognizing) recognition.stop();
    }
    
    // ----------------------------- 事件綁定 -----------------------------
    document.addEventListener('DOMContentLoaded', async ()=>{
        await loadAllDictionaries();
        
        // 點選連動下拉選單：預設為使用者（你）挑選對話發話給外國人 -> 大字顯示外文並播放外文
        inputTextSelect.addEventListener('change', () => {
            let val = inputTextSelect.value;
            if (!val) {
                renderTranslationView("✨ 請選擇對話或開始語音錄音...", "", null);
                return;
            }
            let parts = val.split('|');
            currentZhText = parts[0];
            currentForeignText = parts[1];
            renderTranslationView(currentForeignText, `中文對照: ${currentZhText}`, getForeignLangCode());
        });
        
        clearBtn.addEventListener('click', () => {
            inputTextSelect.value = '';
            currentZhText = ""; currentForeignText = "";
            renderTranslationView("✨ 請選擇對話或開始語音錄音...", "", null);
        });
        
        // 雙語音獨立按鈕監聽
        voiceZhBtn.addEventListener('click', () => startVoiceInput('zh'));
        voiceForeignBtn.addEventListener('click', () => startVoiceInput('foreign'));
        voiceStopBtn.addEventListener('click', stopVoiceInput);
        
        // 雙獨立手動重播鈕
        speakZhBtn.addEventListener('click', () => {
            if (!currentZhText || currentZhText.includes('[未收錄]')) return;
            let utterance = new SpeechSynthesisUtterance(currentZhText);
            utterance.lang = 'zh-TW';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        });
        
        speakForeignBtn.addEventListener('click', () => {
            if (!currentForeignText || currentForeignText.includes('[未收錄]')) return;
            let utterance = new SpeechSynthesisUtterance(currentForeignText);
            utterance.lang = getForeignLangCode();
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        });
        
        // 自訂日常對話
        addWordBtn.addEventListener('click', () => {
            const src = document.getElementById('newWord').value.trim();
            const tgt = document.getElementById('newTrans').value.trim();
            if(!src || !tgt){ alert("請完整填寫中文與外文"); return; }
            
            customDict[currentMode].forward[src] = tgt;
            customDict[currentMode].backward[tgt] = src;
            saveCurrentCustom();
            rebuildActiveMaps();
            
            currentZhText = src; currentForeignText = tgt;
            inputTextSelect.value = `${src}|${tgt}`;
            renderTranslationView(tgt, `中文對照: ${src}`, getForeignLangCode());
            
            document.getElementById('newWord').value = '';
            document.getElementById('newTrans').value = '';
            alert(`✅ 已成功加進對話庫！`);
        });
        
        resetCustomBtn.addEventListener('click', () => {
            if(confirm(`確定清除當前模式的所有自訂對話？`)){
                customDict[currentMode] = { forward:{}, backward:{} };
                saveCurrentCustom();
                rebuildActiveMaps();
                renderTranslationView("✨ 已清空自訂對話", "", null);
            }
        });
        
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => setMode(btn.getAttribute('data-mode')));
        });
        
        initSpeechRecognition();
    });
</script>
</body>
</html>
