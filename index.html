<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>離線翻譯 / 旅遊對話助手</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
            color: #1e293b;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 14px 40px;
        }

        .card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.6rem;
            color: #0f172a;
        }

        .subtext {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 10px;
            line-height: 1.7;
        }

        .mode-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0 8px;
        }

        .mode-btn {
            border: none;
            background: #e2e8f0;
            color: #1e293b;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            margin: 12px 0 8px;
            color: #1e293b;
        }

        .badge {
            display: inline-block;
            margin-left: 8px;
            padding: 3px 10px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.78rem;
            font-weight: 700;
            vertical-align: middle;
        }

        .category-row {
            margin-bottom: 8px;
        }

        .category-row select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 14px;
            border: 2px solid #cbd5e1;
            outline: none;
            font-size: 0.92rem;
            font-family: inherit;
            background: #fff;
            color: #0f172a;
            font-weight: 600;
        }

        .category-row select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
        }

        .search-input-wrapper {
            position: relative;
        }

        #phraseSearch {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 2px solid #cbd5e1;
            outline: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        #phraseSearch:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
        }

        .phrase-list {
            display: none;
            margin-top: 8px;
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        }

        .phrase-item {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .phrase-item:last-child {
            border-bottom: none;
        }

        .phrase-item:hover {
            background: #eff6ff;
        }

        .result-box {
            min-height: 110px;
            border-radius: 18px;
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid #e2e8f0;
            padding: 18px;
            margin-top: 10px;
            line-height: 1.7;
        }

        .action-row,
        .voice-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
        }

        .btn-blue {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
        }

        .btn-green {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
        }

        .btn-orange {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }

        .btn-red {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }

        .btn-gray {
            background: #e2e8f0;
            color: #1e293b;
        }

        .voice-status {
            margin-left: 6px;
            color: #b45309;
            font-size: 0.88rem;
            font-weight: 700;
            align-self: center;
        }

        .custom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .custom-grid input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 14px;
            border: 2px solid #cbd5e1;
            outline: none;
            font-size: 0.95rem;
        }

        .custom-grid input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
        }

        .small-note {
            color: #64748b;
            font-size: 0.84rem;
            margin-top: 8px;
            line-height: 1.6;
        }

        @media (max-width: 720px) {
            .custom-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 14px 10px 28px;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🧳 離線翻譯 / 旅遊對話助手</h1>
            <div class="subtext">
                支援 <strong>中英 / 中日 / 中韓</strong> 對話句庫搜尋、分類篩選、語音搜尋、點句自動播放外語，
                也可以自行新增常用對話到本機自訂詞庫。<br>
                <strong>新版：</strong> 可直接按「聽外國人回話」，把對方講的外文抓成關鍵詞，從句庫反查最接近的中文句子。
            </div>

            <div class="mode-bar">
                <button class="mode-btn active" data-mode="general">🇺🇸 中英對話</button>
                <button class="mode-btn" data-mode="japanese">🇯🇵 中日對話</button>
                <button class="mode-btn" data-mode="korean">🇰🇷 中韓對話</button>
            </div>
        </div>

        <div class="card">
            <label>
                🔍 搜尋 / 外國人回話辨識
                <span class="badge" id="langHint">模式: 中英文雙向對話</span>
            </label>

            <div class="category-row">
                <select id="categorySelect">
                    <option value="全部分類">全部分類</option>
                </select>
            </div>

            <div class="search-input-wrapper">
                <input
                    type="text"
                    id="phraseSearch"
                    placeholder="輸入中文或外文關鍵字，例如：菜單 / airport / 退房 / taxi"
                    autocomplete="off"
                />
            </div>

            <div id="phraseList" class="phrase-list"></div>

            <div class="voice-row">
                <button id="voiceZhBtn" class="btn-blue">🎤 說中文篩選</button>
                <button id="voiceForeignBtn" class="btn-green">🎤 聽外國人回話</button>
                <button id="voiceStopBtn" class="btn-red">⏹ 停止語音</button>
                <span id="voiceStatus" class="voice-status"></span>
            </div>

            <div id="outputText" class="result-box">
                ✨ 請先選分類、輸入關鍵字，或直接按「聽外國人回話」...
            </div>

            <div class="action-row">
                <button id="speakZhBtn" class="btn-orange">🔊 播放中文</button>
                <button id="speakForeignBtn" class="btn-orange">🔊 播放外語</button>
                <button id="clearBtn" class="btn-gray">🧹 清除 / 重設</button>
            </div>
        </div>

        <div class="card">
            <label>➕ 新增自訂對話</label>
            <div class="custom-grid">
                <input type="text" id="newWord" placeholder="輸入中文，例如：請幫我叫計程車" />
                <input type="text" id="newTrans" placeholder="輸入對應外文翻譯" />
            </div>

            <div class="action-row">
                <button id="addWordBtn" class="btn-blue">➕ 加入目前模式詞庫</button>
                <button id="resetCustomBtn" class="btn-red">🗑 清空目前模式自訂詞庫</button>
            </div>

            <div class="small-note">
                自訂詞彙會儲存在瀏覽器本機（LocalStorage），依模式分開保存：
                <strong>中英 / 中日 / 中韓</strong> 各自獨立。
            </div>
        </div>
    </div>

    <!-- 只保留這一個 JS，不要再把整段 JS 寫在 index 裡 -->
    <script src="app.js"></script>
</body>
</html>
