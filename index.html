<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>英日韓離線翻譯</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', 'Noto Sans CJK TC', 'Noto Sans Japanese', 'Noto Sans Korean', 'Helvetica Neue', sans-serif;
            font-weight: 500;
            background: #eef2f7;
            margin: 0;
            min-height: 100vh;
            padding: 6px;
        }
        .app-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            overflow: hidden;
            margin-bottom: 12px;
        }
        .header {
            background: #1e3a5f;
            padding: 10px 14px;
            color: white;
        }
        .header h1 {
            margin: 0 0 2px 0;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .header p {
            margin: 0;
            font-size: 0.6rem;
            opacity: 0.85;
        }
        .content {
            padding: 10px 12px;
        }
        .mode-selector {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            background: #f8fafc;
            padding: 5px 8px;
            border-radius: 40px;
            justify-content: center;
        }
        .mode-btn {
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            color: #334155;
        }
        .mode-btn.active {
            background: #1e3a5f;
            color: white;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            font-weight: 700;
            font-size: 0.7rem;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }
        /* 新增：智慧連動下拉選單樣式 */
        select.phrase-select {
            width: 100%;
            padding: 8px 12px;
            font-size: 0.8rem;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 500;
            background: #fefefe;
            color: #1e293b;
            outline: none;
            cursor: pointer;
        }
        select.phrase-select:focus {
            border-color: #1e3a5f;
            box-shadow: 0 0 0 2px rgba(30,58,95,0.15);
        }
        .suggestions-container {
            background: #ffffff;
            border-radius: 14px;
            margin-top: 6px;
            border: 1px solid #e2e8f0;
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px 8px;
        }
        .suggestion-chip {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid #cbd5e1;
        }
        .suggestion-chip:active {
            background: #e2e8f0;
            transform: scale(0.96);
        }
        .button-group {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .result-wrapper {
            background: #f1f5f9;
            border-radius: 14px;
            padding: 6px 10px;
            border-left: 4px solid #1e3a5f;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .result-box {
            font-size: 0.8rem;
            font-weight: 500;
            word-break: break-word;
            flex: 1;
        }
        button {
            background: #1e3a5f;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .speak-btn { background: #475569; }
        .voice-btn { background: #2c6e2f; }
        .stop-btn { background: #9a3412; }
        .translate-btn { background: #1e3a5f; }
        button.small { background: #475569; padding: 3px 8px; font-size: 0.6rem; }
        .custom-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 8px 10px;
            margin-top: 12px;
            border: 1px solid #e2e8f0;
        }
        .custom-section h4 {
            font-size: 0.7rem;
            margin: 0 0 6px 0;
            font-weight: 700;
        }
        .flex-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .flex-row input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .note {
            font-size: 0.55rem;
            color: #475569;
            text-align: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
        }
        .badge {
            background: #e6f0ff;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #1e3a5f;
        }
        .voice-status {
            font-size: 0.6rem;
            color: #2c6e2f;
            margin-left: 4px;
        }
        @media (max-width: 560px) {
            .suggestions-container { max-height: 130px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <div class="header">
            <h1>🌏 智慧連動翻譯助手</h1>
            <p>中英｜中日｜中韓 · 模式語系連動下拉選單</p>
        </div>
        <div class="content">

            <div class="mode-selector" id="modeSelector">
                <button data-mode="general" class="mode-btn active">📖 中英模式</button>
                <button data-mode="japanese" class="mode-btn">🗾 日語模式</button>
                <button data-mode="korean" class="mode-btn">🇰🇷 韓語模式</button>
            </div>

            <div class="input-group">
                <label>🔽 請選擇或點選常用詞彙 <span class="badge">隨模式自動切換</span></label>
                
                <select id="inputText" class="phrase-select">
                    <option value="">⏳ 正在載入字典檔案...</option>
                </select>

                <div id="suggestionsPanel" class="suggestions-container" style="display: none;"></div>
                
                <div class="button-group">
                    <button id="clearBtn">重設選擇</button>
                    <button id="voiceInputBtn" class="voice-btn">🎤 語音輸入辨識</button>
                    <button id="voiceStopBtn" class="stop-btn">⏹️ 停止</button>
                    <button id="translateBtn" class="translate-btn">🔍 翻譯</button>
                    <span id="voiceStatus" class="voice-status"></span>
                </div>
            </div>

            <div class="input-group">
                <label>🔊 翻譯結果 <span class="badge" id="langHint">模式: 中英雙向</span></label>
                <div class="result-wrapper">
                    <div class="result-box" id="outputText">✨ 請從上方下拉選單選取內容...</div>
                    <button id="speakResultBtn" class="speak-btn">🔊 朗讀結果</button>
                </div>
            </div>

            <div class="custom-section">
                <h4>📝 新增自訂詞彙 (目前語言模式專用)</h4>
                <div class="flex-row">
                    <input type="text" id="newWord" placeholder="中文原文">
                    <input type="text" id="newTrans" placeholder="外文翻譯">
                    <button id="addWordBtn">➕ 新增</button>
                </div>
                <div style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap;">
                    <button id="resetCustomBtn" class="small">🗑️ 清除當前自訂詞</button>
                    <span class="badge">各模式獨立儲存</span>
                </div>
            </div>
            <div class="note">
                💡 智慧連動：切換上方模式時，下拉選單會自動載入對應 JSON 檔（`zh_en_dual`、`zh_ja_dual`、`zh_ko_dual`）的所有中文詞條。<br>
                🎤 語音輸入：若使用語音輸入辨識成功，系統會自動在下拉選單中尋找匹配項並完成翻譯。
            </div>
        </div>
    </div>
</div>

<script>
    // ----------------------------- 全域變數與字典 -----------------------------
    let currentMode = 'general';
    let dictGeneral = { dual: {} };
    let dictJapanese = { dual: {} };
    let dictKorean = { dual: {} };
    
    let customDict = {
        general: { forward: {}, backward: {} },
        japanese: { forward: {}, backward: {} },
        korean: { forward: {}, backward: {} }
    };
    
    let activeForwardMap = {};
    let activeBackwardMap = {};
    let recognition = null;
    let isRecognizing = false;
    let isLoading = true;
    
    // DOM 元素指派
    const inputTextSelect = document.getElementById('inputText');
    const outputDiv = document.getElementById('outputText');
    const clearBtn = document.getElementById('clearBtn');
    const addWordBtn = document.getElementById('addWordBtn');
    const resetCustomBtn = document.getElementById('resetCustomBtn');
    const speakResultBtn = document.getElementById('speakResultBtn');
    const voiceInputBtn = document.getElementById('voiceInputBtn');
    const voiceStopBtn = document.getElementById('voiceStopBtn');
    const translateBtn = document.getElementById('translateBtn');
    const voiceStatusSpan = document.getElementById('voiceStatus');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const langHintSpan = document.getElementById('langHint');
    const suggestionsPanel = document.getElementById('suggestionsPanel');
    
    // ----------------------------- 輔助處理 -----------------------------
    function cleanText(text) {
        let cleaned = text.trim();
        cleaned = cleaned.replace(/[。，！？；：""''（）【】《》…—・、,\.!\?;:\(\)\[\]\{\}<>]/g, '');
        cleaned = cleaned.replace(/\s+/g, ' ').trim();
        return cleaned;
    }
    
    function getFallbackDict(langType) {
        if (langType === 'en') return { "你好":"Hello","謝謝":"Thank you","對不起":"Sorry","多少錢":"How much","廁所在哪裡":"Where is the restroom","我來自台灣":"I'm from Taiwan","很好吃":"Delicious","再見":"Goodbye" };
        if (langType === 'ja') return { "你好":"こんにちは","謝謝":"ありがとう","對不起":"すみません","多少錢":"いくらですか","廁所在哪裡":"トイレはどこですか","我來自台灣":"台湾から来ました","很好吃":"美味しいです","再見":"さようなら" };
        return { "你好":"안녕하세요","謝謝":"감사합니다","對不起":"죄송합니다","多少錢":"얼마예요","廁所在哪裡":"화장실이 어디에요","我來自台灣":"저는 대만에서 왔어요","很好吃":"맛있어요","再見":"안녕히 가세요" };
    }
    
    async function loadJSON(url, fallbackObj) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            return await res.json();
        } catch { return fallbackObj; }
    }
    
    // 動態更新下拉選單 (<select>) 內容
    function updateSelectOptions() {
        // 清空現有選項
        inputTextSelect.innerHTML = '';
        
        // 建立預設提示選項
        let defaultOpt = document.createElement('option');
        defaultOpt.value = '';
        defaultOpt.textContent = '--- 請選擇要翻譯的句子 ---';
        inputTextSelect.appendChild(defaultOpt);
        
        // 從目前的 activeForwardMap 撈出所有的中文 Key 並排序
        const sortedKeys = Object.keys(activeForwardMap).sort((a, b) => a.localeCompare(b, 'zh'));
        
        sortedKeys.forEach(key => {
            let opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            inputTextSelect.appendChild(opt);
        });
    }
    
    async function loadAllDictionaries() {
        dictGeneral.dual = await loadJSON('data/zh_en_dual.json', getFallbackDict('en'));
        dictJapanese.dual = await loadJSON('data/zh_ja_dual.json', getFallbackDict('ja'));
        dictKorean.dual = await loadJSON('data/zh_ko_dual.json', getFallbackDict('ko'));
        
        loadCustomFromStorage();
        rebuildActiveMaps();
        
        isLoading = false;
        performTranslation();
    }
    
    function loadCustomFromStorage() {
        ['general','japanese','korean'].forEach(mode=>{
            const stored = localStorage.getItem(`customDict_${mode}`);
            if(stored) try{ customDict[mode]=JSON.parse(stored); }catch(e){}
            else customDict[mode]={ forward:{}, backward:{} };
        });
    }
    
    function saveCurrentCustom() { localStorage.setItem(`customDict_${currentMode}`, JSON.stringify(customDict[currentMode])); }
    
    function rebuildActiveMaps() {
        let baseForward={}, baseBackward={};
        if(currentMode==='general') { baseForward={...dictGeneral.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        else if(currentMode==='japanese') { baseForward={...dictJapanese.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        else { baseForward={...dictKorean.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        
        const cf = customDict[currentMode].forward || {};
        const cb = customDict[currentMode].backward || {};
        activeForwardMap = { ...baseForward, ...cf };
        activeBackwardMap = { ...baseBackward, ...cb };
        
        for(let [src,tgt] of Object.entries(cf)) if(!activeBackwardMap[tgt]) activeBackwardMap[tgt]=src;
        for(let [tgt,src] of Object.entries(cb)) if(!activeForwardMap[src]) activeForwardMap[src]=tgt;
        
        const modeText = currentMode==='general'?'中英雙向':(currentMode==='japanese'?'中日雙向':'中韓雙向');
        langHintSpan.innerText = `模式: ${modeText}`;
        
        // 核心改動：重新構建 activeMap 後，立即重新填裝下拉選單
        updateSelectOptions();
    }
    
    function translateWithLongestMatch(rawText, forwardMap, backwardMap) {
        let cleaned = cleanText(rawText);
        if(!cleaned) return "";
        let lower = cleaned.toLowerCase();
        if(forwardMap[lower]) return forwardMap[lower];
        if(backwardMap[lower]) return backwardMap[lower];
        return "⚠️ 未收錄此詞彙，可從下方手動自訂新增";
    }
    
    function performTranslation() {
        if(isLoading) { outputDiv.innerHTML="⏳ 字典資料載入中..."; return; }
        let selectedValue = inputTextSelect.value;
        if(!selectedValue) { outputDiv.innerHTML="⚡ 請從上方下拉選單選擇內容，或使用語音輸入..."; return; }
        outputDiv.innerHTML = translateWithLongestMatch(selectedValue, activeForwardMap, activeBackwardMap);
    }
    
    function setMode(mode) {
        if(currentMode===mode) return;
        currentMode=mode;
        modeBtns.forEach(btn=>{
            if(btn.getAttribute('data-mode')===mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        rebuildActiveMaps();
        performTranslation();
    }
    
    function speakText(text){
        if(!text || text.startsWith("⚠️")||text.startsWith("⚡")) return;
        let utterance = new SpeechSynthesisUtterance(text);
        if(/[\uAC00-\uD7AF]/.test(text)) utterance.lang='ko-KR';
        else if(/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/.test(text)) utterance.lang='ja-JP';
        else if(/[a-zA-Z]/.test(text) && !/[\u4e00-\u9fff]/.test(text)) utterance.lang='en-US';
        else utterance.lang='zh-TW';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }
    
    // ----------------------------- 語音辨識區 -----------------------------
    function initSpeechRecognition() {
        if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
            voiceStatusSpan.innerText='⚠️ 瀏覽器不支援語音';
            if(voiceInputBtn) voiceInputBtn.disabled=true;
            if(voiceStopBtn) voiceStopBtn.disabled=true;
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous=false;
        recognition.interimResults=false;
        recognition.lang='zh-TW';
        
        recognition.onstart=()=>{
            isRecognizing=true;
            voiceStatusSpan.innerText='🎙️ 聆聽中文中...';
            if(voiceInputBtn) voiceInputBtn.style.opacity='0.6';
        };
        recognition.onend=()=>{
            isRecognizing=false;
            voiceStatusSpan.innerText='';
            if(voiceInputBtn) voiceInputBtn.style.opacity='1';
        };
        recognition.onerror=(event)=>{
            let err = event.error==='not-allowed'?'❌ 未允許麥克風':`錯誤:${event.error}`;
            voiceStatusSpan.innerText=err;
            isRecognizing=false;
        };
        recognition.onresult=(event)=>{
            let transcript = event.results[0][0].transcript;
            if(transcript){
                let cleaned = cleanText(transcript);
                
                // 語音核心邏輯：檢查下拉選單中是否存在該語音中文，有就選中，沒有就動態塞入一個臨時選項
                let hasOption = Array.from(inputTextSelect.options).some(opt => opt.value === cleaned);
                if(!hasOption) {
                    let tempOpt = document.createElement('option');
                    tempOpt.value = cleaned;
                    tempOpt.textContent = `🎤 語音輸入: ${cleaned}`;
                    inputTextSelect.appendChild(tempOpt);
                }
                
                inputTextSelect.value = cleaned;
                performTranslation();
                voiceStatusSpan.innerText='✅ 辨識完成';
                setTimeout(()=>{ voiceStatusSpan.innerText=''; }, 1500);
            }
            recognition.stop();
        };
    }
    
    function startVoiceInput(){
        if(!recognition){ alert("不支援語音"); return; }
        try{ recognition.start(); }catch(e){}
    }
    function stopVoiceInput(){
        if(recognition && isRecognizing){ recognition.stop(); }
    }
    
    // ----------------------------- 自訂擴充與事件繫結 -----------------------------
    function addCustomWord(){
        const src = document.getElementById('newWord').value.trim();
        const tgt = document.getElementById('newTrans').value.trim();
        if(!src || !tgt){ alert("請輸入原文與對應翻譯"); return; }
        const modeCust = customDict[currentMode];
        modeCust.forward[src]=tgt;
        modeCust.backward[tgt]=src;
        saveCurrentCustom();
        rebuildActiveMaps(); // 會同步呼叫 updateSelectOptions() 刷新選單
        
        // 預先選中剛新增的項目
        inputTextSelect.value = src;
        performTranslation();
        
        document.getElementById('newWord').value='';
        document.getElementById('newTrans').value='';
        alert(`✅ 成功新增並置入選單：${src} → ${tgt}`);
    }
    
    function resetCurrentCustom(){
        if(confirm(`確定清除「${currentMode}」的所有自訂詞彙？`)){
            customDict[currentMode]={ forward:{}, backward:{} };
            saveCurrentCustom();
            rebuildActiveMaps();
            performTranslation();
        }
    }
    
    // 監聽器初始化
    document.addEventListener('DOMContentLoaded', async ()=>{
        await loadAllDictionaries();
        
        // 下拉選單值改變時，直接進行翻譯
        inputTextSelect.addEventListener('change', performTranslation);
        
        clearBtn.addEventListener('click', ()=>{
            inputTextSelect.value = '';
            performTranslation();
        });
        
        addWordBtn.addEventListener('click', addCustomWord);
        resetCustomBtn.addEventListener('click', resetCurrentCustom);
        
        speakResultBtn.addEventListener('click', ()=>{
            let txt = outputDiv.innerText;
            speakText(txt);
        });
        
        translateBtn.addEventListener('click', performTranslation);
        
        modeBtns.forEach(btn=>{
            btn.addEventListener('click', ()=>{
                let mode = btn.getAttribute('data-mode');
                if(mode) setMode(mode);
            });
        });
        
        initSpeechRecognition();
        voiceInputBtn.addEventListener('click', startVoiceInput);
        voiceStopBtn.addEventListener('click', stopVoiceInput);
    });
</script>
</body>
</html>
