<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>對話式雙向翻譯助手 · 即時語音版</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', 'Noto Sans CJK TC', 'Noto Sans Japanese', 'Noto Sans Korean', 'Helvetica Neue', sans-serif;
            font-weight: 500;
            background: #eef2f7;
            margin: 0;
            min-height: 100vh;
            padding: 6px;
        }
        .app-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            overflow: hidden;
            margin-bottom: 12px;
        }
        .header {
            background: #1e3a5f;
            padding: 10px 14px;
            color: white;
        }
        .header h1 {
            margin: 0 0 2px 0;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .header p {
            margin: 0;
            font-size: 0.6rem;
            opacity: 0.85;
        }
        .content {
            padding: 10px 12px;
        }
        .mode-selector {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            background: #f8fafc;
            padding: 5px 8px;
            border-radius: 40px;
            justify-content: center;
        }
        .mode-btn {
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            color: #334155;
        }
        .mode-btn.active {
            background: #1e3a5f;
            color: white;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            font-weight: 700;
            font-size: 0.7rem;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }
        select.phrase-select {
            width: 100%;
            padding: 8px 12px;
            font-size: 0.8rem;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 500;
            background: #fefefe;
            color: #1e293b;
            outline: none;
            cursor: pointer;
        }
        select.phrase-select:focus {
            border-color: #1e3a5f;
            box-shadow: 0 0 0 2px rgba(30,58,95,0.15);
        }
        .button-group {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .result-wrapper {
            background: #f1f5f9;
            border-radius: 14px;
            padding: 6px 10px;
            border-left: 4px solid #1e3a5f;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .result-box {
            font-size: 0.8rem;
            font-weight: 500;
            word-break: break-word;
            flex: 1;
        }
        button {
            background: #1e3a5f;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .speak-btn { background: #475569; }
        .voice-btn { background: #2c6e2f; }
        .stop-btn { background: #9a3412; }
        .translate-btn { background: #1e3a5f; }
        button.small { background: #475569; padding: 3px 8px; font-size: 0.6rem; }
        .custom-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 8px 10px;
            margin-top: 12px;
            border: 1px solid #e2e8f0;
        }
        .custom-section h4 {
            font-size: 0.7rem;
            margin: 0 0 6px 0;
            font-weight: 700;
        }
        .flex-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .flex-row input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .note {
            font-size: 0.55rem;
            color: #475569;
            text-align: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
        }
        .badge {
            background: #e6f0ff;
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #1e3a5f;
        }
        .voice-status {
            font-size: 0.6rem;
            color: #2c6e2f;
            margin-left: 4px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <div class="header">
            <h1>💬 對話式雙向隨身翻譯</h1>
            <p>即時雙向選單 · 辨識完畢自動發聲朗讀</p>
        </div>
        <div class="content">

            <div class="mode-selector" id="modeSelector">
                <button data-mode="general" class="mode-btn active">🇺🇸 中英對話 (聽英文/中文)</button>
                <button data-mode="japanese" class="mode-btn">🗾 中日對話 (聽日文/中文)</button>
                <button data-mode="korean" class="mode-btn">🇰🇷 中韓對話 (聽韓文/中文)</button>
            </div>

            <div class="input-group">
                <label id="selectLabel">🔽 請選擇常用對話句</label>
                
                <select id="inputText" class="phrase-select">
                    <option value="">⏳ 正在載入對話字典...</option>
                </select>
                
                <div class="button-group">
                    <button id="clearBtn">重設選擇</button>
                    <button id="voiceInputBtn" class="voice-btn">🎤 語音輸入</button>
                    <button id="voiceStopBtn" class="stop-btn">⏹️ 停止</button>
                    <button id="translateBtn" class="translate-btn">🔍 翻譯</button>
                    <span id="voiceStatus" class="voice-status"></span>
                </div>
            </div>

            <div class="input-group">
                <label>🔊 翻譯與發音結果 <span class="badge" id="langHint">模式: 中英對話</span></label>
                <div class="result-wrapper">
                    <div class="result-box" id="outputText">✨ 請選擇對話或按語音按鈕...</div>
                    <button id="speakResultBtn" class="speak-btn">🔊 重讀一次</button>
                </div>
            </div>

            <div class="custom-section">
                <h4>📝 新增日常對話句 (目前語言模式專用)</h4>
                <div class="flex-row">
                    <input type="text" id="newWord" placeholder="中文內容">
                    <input type="text" id="newTrans" placeholder="外文內容">
                    <button id="addWordBtn">➕ 新增</button>
                </div>
                <div style="margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap;">
                    <button id="resetCustomBtn" class="small">🗑️ 清除當前對話</button>
                    <span class="badge">各模式獨立儲存</span>
                </div>
            </div>
            <div class="note">
                💡 <b>優化提示</b>：選單已全數改為「外文在前 ➔ 中文在後」方便對照與外國人選取。選定後系統會<b>自動播放聲音</b>。
            </div>
        </div>
    </div>
</div>

<script>
    // ----------------------------- 全域變數與字典 -----------------------------
    let currentMode = 'general';
    let dictGeneral = { dual: {} };
    let dictJapanese = { dual: {} };
    let dictKorean = { dual: {} };
    
    let customDict = {
        general: { forward: {}, backward: {} },
        japanese: { forward: {}, backward: {} },
        korean: { forward: {}, backward: {} }
    };
    
    let activeForwardMap = {}; // 中 -> 外
    let activeBackwardMap = {}; // 外 -> 中
    let recognition = null;
    let isRecognizing = false;
    let isLoading = true;
    
    const inputTextSelect = document.getElementById('inputText');
    const outputDiv = document.getElementById('outputText');
    const selectLabel = document.getElementById('selectLabel');
    const clearBtn = document.getElementById('clearBtn');
    const addWordBtn = document.getElementById('addWordBtn');
    const resetCustomBtn = document.getElementById('resetCustomBtn');
    const speakResultBtn = document.getElementById('speakResultBtn');
    const voiceInputBtn = document.getElementById('voiceInputBtn');
    const voiceStopBtn = document.getElementById('voiceStopBtn');
    const translateBtn = document.getElementById('translateBtn');
    const voiceStatusSpan = document.getElementById('voiceStatus');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const langHintSpan = document.getElementById('langHint');
    
    function cleanText(text) {
        let cleaned = text.trim();
        cleaned = cleaned.replace(/[。，！？；：""''（）【】《》…—・、,\.!\?;:\(\)\[\]\{\}<>]/g, '');
        cleaned = cleaned.replace(/\s+/g, ' ').trim();
        return cleaned;
    }
    
    function getFallbackDict(langType) {
        if (langType === 'en') return { "你好":"Hello","謝謝":"Thank you","多少錢":"How much","對不起":"Sorry" };
        if (langType === 'ja') return { "你好":"こんにちは","謝謝":"ありがとう","多少錢":"いくらですか","對不起":"すみません" };
        return { "你好":"안녕하세요","謝謝":"감사합니다","多少錢":"얼마예요","對不起":"죄송합니다" };
    }
    
    async function loadJSON(url, fallbackObj) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            return await res.json();
        } catch { return fallbackObj; }
    }
    
    // 所有選單同步改為：外文在前 ➔ 中文在後，完美貼合對話式雙向操作
    function updateSelectOptions() {
        inputTextSelect.innerHTML = '';
        
        let defaultOpt = document.createElement('option');
        defaultOpt.value = '';
        
        let langName = currentMode === 'general' ? '英文' : (currentMode === 'japanese' ? '日文' : '韓文');
        defaultOpt.textContent = `--- 請選擇對話句子 (${langName} ➔ 中文) ---`;
        selectLabel.textContent = `🔽 ${langName}與中文雙向選單 (點選立即翻譯與發音)`;
        inputTextSelect.appendChild(defaultOpt);
        
        // 一律以外文作為主軸排序
        Object.keys(activeBackwardMap).sort().forEach(foreign => {
            let opt = document.createElement('option');
            opt.value = activeBackwardMap[foreign]; // 綁定內部中文核心值
            opt.textContent = `${foreign} ➔ ${activeBackwardMap[foreign]}`;
            inputTextSelect.appendChild(opt);
        });
    }
    
    async function loadAllDictionaries() {
        dictGeneral.dual = await loadJSON('data/zh_en_dual.json', getFallbackDict('en'));
        dictJapanese.dual = await loadJSON('data/zh_ja_dual.json', getFallbackDict('ja'));
        dictKorean.dual = await loadJSON('data/zh_ko_dual.json', getFallbackDict('ko'));
        
        loadCustomFromStorage();
        rebuildActiveMaps();
        isLoading = false;
        performTranslation(false); // 初始不自動播放
    }
    
    function loadCustomFromStorage() {
        ['general','japanese','korean'].forEach(mode=>{
            const stored = localStorage.getItem(`customDict_${mode}`);
            if(stored) try{ customDict[mode]=JSON.parse(stored); }catch(e){}
            else customDict[mode]={ forward:{}, backward:{} };
        });
    }
    
    function saveCurrentCustom() { localStorage.setItem(`customDict_${currentMode}`, JSON.stringify(customDict[currentMode])); }
    
    function rebuildActiveMaps() {
        let baseForward={}, baseBackward={};
        if(currentMode==='general') { baseForward={...dictGeneral.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        else if(currentMode==='japanese') { baseForward={...dictJapanese.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        else { baseForward={...dictKorean.dual}; for(let [k,v] of Object.entries(baseForward)) baseBackward[v]=k; }
        
        const cf = customDict[currentMode].forward || {};
        const cb = customDict[currentMode].backward || {};
        activeForwardMap = { ...baseForward, ...cf };
        activeBackwardMap = { ...baseBackward, ...cb };
        
        for(let [src,tgt] of Object.entries(cf)) if(!activeBackwardMap[tgt]) activeBackwardMap[tgt]=src;
        for(let [tgt,src] of Object.entries(cb)) if(!activeForwardMap[src]) activeForwardMap[src]=tgt;
        
        const modeText = currentMode==='general'?'中英對話':(currentMode==='japanese'?'中日對話':'中韓對話');
        langHintSpan.innerText = `模式: ${modeText}`;
        
        updateSelectOptions();
        updateSpeechLanguage();
    }
    
    // 執行翻譯邏輯 (新增 triggerSpeak 參數，避免初次載入就嚇人一跳)
    function performTranslation(triggerSpeak = true) {
        if(isLoading) { outputDiv.innerHTML="⏳ 字典資料載入中..."; return; }
        let selectedValue = inputTextSelect.value; 
        if(!selectedValue) { outputDiv.innerHTML="✨ 請選擇上方對話或按語音按鈕..."; return; }
        
        // 尋找對應的外文內容
        let foreignText = Object.keys(activeBackwardMap).find(key => activeBackwardMap[key] === selectedValue) || activeForwardMap[selectedValue];
        
        // 畫面上同時優雅地呈現兩者
        outputDiv.innerHTML = `<span style="color:#1e3a5f; font-weight:700; font-size:0.95rem;">${selectedValue}</span> <br><small style="color:#475569; font-size:0.8rem;">(${foreignText})</small>`;
        
        // 關鍵核心：若允許播放，翻譯完畢立即呼叫喇叭
        if(triggerSpeak) {
            speakText();
        }
    }
    
    function setMode(mode) {
        if(currentMode===mode) return;
        currentMode=mode;
        modeBtns.forEach(btn=>{
            if(btn.getAttribute('data-mode')===mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        rebuildActiveMaps();
        performTranslation(false);
    }
    
    // 語音播放優化：自動解析要讀中文還是外文
    function speakText(){
        let rawContent = outputDiv.innerText.trim();
        if(!rawContent || rawContent.includes("✨") || rawContent.includes("⏳")) return;
        
        // 切分出中文與括號裡面的外文
        let lines = rawContent.split('\n');
        let chinesePart = lines[0].trim();
        let foreignPart = lines[1] ? lines[1].replace(/[\(\)]/g, '').trim() : '';
        
        // 如果使用者語音輸入的是外文，我們通常對外國人播放「中文回答」；
        // 如果使用者點選的是外文選單，我們對外國人播放「外文內容」。
        // 這裡做一個非常聰明的智慧判斷：如果外文包含中文標籤，代表沒對上，讀中文。
        let textToSpeak = foreignPart && !foreignPart.includes("未收錄") ? foreignPart : chinesePart;
        
        let utterance = new SpeechSynthesisUtterance(textToSpeak);
        
        // 設定對應發音語系
        if(textToSpeak === foreignPart) {
            if(currentMode === 'korean') utterance.lang='ko-KR';
            else if(currentMode === 'japanese') utterance.lang='ja-JP';
            else utterance.lang='en-US';
        } else {
            utterance.lang='zh-TW';
        }
        
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }
    
    // ----------------------------- 語音辨識連動 -----------------------------
    function updateSpeechLanguage() {
        if (!recognition) return;
        let langName = currentMode === 'general' ? '英/中' : (currentMode === 'japanese' ? '日/中' : '韓/中');
        voiceInputBtn.textContent = `🎤 語音輸入 (${langName})`;
        
        // 預設辨識：中英模式聽英文、日語模式聽日文、韓語模式聽韓文
        if (currentMode === 'japanese') recognition.lang = 'ja-JP';
        else if (currentMode === 'korean') recognition.lang = 'ko-KR';
        else recognition.lang = 'en-US';
    }

    function initSpeechRecognition() {
        if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
            voiceStatusSpan.innerText='⚠️ 不支援語音';
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        // 開啟連續或嘗試更寬容的對話模式
        recognition.continuous=false;
        recognition.interimResults=false;
        
        updateSpeechLanguage();
        
        recognition.onstart=()=>{
            isRecognizing=true;
            let targetLang = currentMode==='general'?'英文/中文':(currentMode==='japanese'?'日文':'韓文');
            voiceStatusSpan.innerText = `🎙️ 正在聆聽 ${targetLang}...`;
            voiceInputBtn.style.opacity='0.6';
        };
        recognition.onend=()=>{
            isRecognizing=false;
            voiceStatusSpan.innerText='';
            voiceInputBtn.style.opacity='1';
        };
        recognition.onerror=(event)=>{
            // 友善容錯：如果外文聽不懂，自動切換成聽中文
            if(recognition.lang !== 'zh-TW') {
                voiceStatusSpan.innerText='🔄 嘗試切換聽中文...';
                recognition.lang = 'zh-TW';
                try { recognition.start(); return; } catch(e){}
            }
            voiceStatusSpan.innerText='❌ 辨識失敗';
            isRecognizing=false;
        };
        recognition.onresult=(event)=>{
            let transcript = event.results[0][0].transcript;
            if(transcript){
                let cleaned = cleanText(transcript);
                let matchedChinese = "";
                
                // 判斷聽到的是中文還是外文
                let isChineseInput = /[\u4e00-\u9fa5]/.test(cleaned);
                
                if (isChineseInput) {
                    // 聽到了中文
                    if(activeForwardMap[cleaned]) {
                        matchedChinese = cleaned;
                    } else {
                        matchedChinese = cleaned;
                        activeForwardMap[cleaned] = `[Translation needed] ${cleaned}`;
                        activeBackwardMap[`[Translation needed] ${cleaned}`] = cleaned;
                    }
                } else {
                    // 聽到了外文
                    let lowCleaned = cleaned.toLowerCase();
                    let foundKey = Object.keys(activeBackwardMap).find(k => k.toLowerCase() === lowCleaned || k.toLowerCase().includes(lowCleaned));
                    
                    if (foundKey) {
                        matchedChinese = activeBackwardMap[foundKey];
                    } else {
                        matchedChinese = `外文辨識_${cleaned}`;
                        activeBackwardMap[cleaned] = matchedChinese;
                        activeForwardMap[matchedChinese] = cleaned;
                    }
                }
                
                updateSelectOptions();
                inputTextSelect.value = matchedChinese;
                
                // 核心改動：翻譯完馬上自動播放語音 (帶入 true)
                performTranslation(true);
                
                voiceStatusSpan.innerText='✅ 完成並發音';
                setTimeout(()=>{ voiceStatusSpan.innerText=''; }, 1500);
            }
            recognition.stop();
        };
    }
    
    function startVoiceInput(){
        if(!recognition){ alert("不支援語音"); return; }
        updateSpeechLanguage(); // 每次點擊都校正一次初始語系
        try{ recognition.start(); }catch(e){}
    }
    function stopVoiceInput(){
        if(recognition && isRecognizing){ recognition.stop(); }
    }
    
    function addCustomWord(){
        const src = document.getElementById('newWord').value.trim();
        const tgt = document.getElementById('newTrans').value.trim();
        if(!src || !tgt){ alert("請填寫完整"); return; }
        const modeCust = customDict[currentMode];
        modeCust.forward[src]=tgt;
        modeCust.backward[tgt]=src;
        saveCurrentCustom();
        rebuildActiveMaps();
        
        inputTextSelect.value = src;
        performTranslation(true); // 新增完也自動放聲音確認
        document.getElementById('newWord').value='';
        document.getElementById('newTrans').value='';
        alert(`✅ 已新增並套用對話`);
    }
    
    function resetCurrentCustom(){
        if(confirm(`確定清除「${currentMode}」所有對話？`)){
            customDict[currentMode]={ forward:{}, backward:{} };
            saveCurrentCustom();
            rebuildActiveMaps();
            performTranslation(false);
        }
    }
    
    document.addEventListener('DOMContentLoaded', async ()=>{
        await loadAllDictionaries();
        
        // 監聽選單變更 -> 自動翻譯並發音
        inputTextSelect.addEventListener('change', () => performTranslation(true));
        
        clearBtn.addEventListener('click', ()=>{ inputTextSelect.value = ''; performTranslation(false); });
        addWordBtn.addEventListener('click', addCustomWord);
        resetCustomBtn.addEventListener('click', resetCurrentCustom);
        speakResultBtn.addEventListener('click', speakText);
        translateBtn.addEventListener('click', () => performTranslation(true));
        
        modeBtns.forEach(btn=>{
            btn.addEventListener('click', ()=>{
                let mode = btn.getAttribute('data-mode');
                if(mode) setMode(mode);
            });
        });
        
        initSpeechRecognition();
        voiceInputBtn.addEventListener('click', startVoiceInput);
        voiceStopBtn.addEventListener('click', stopVoiceInput);
    });
</script>
</body>
</html>
